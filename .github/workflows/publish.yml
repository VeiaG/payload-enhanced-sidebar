name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: # Allow manual trigger from Actions tab

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships with npm 10.
      # pnpm hands the actual publish over to the npm CLI. Pinned to the 11.x line:
      # `latest` can jump to a major that drops support for this Node version.
      - name: Update npm
        run: npm install -g npm@11

      # No token: npm authenticates via the workflow's OIDC token and adds provenance.
      - name: Publish
        run: pnpm publish --no-git-checks --access public
